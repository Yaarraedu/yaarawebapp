<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yaara Consortium</title>

  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Yaara">
  <meta name="theme-color" content="#12294d">

  <script>
    var APP_URL = 'https://script.google.com/macros/s/AKfycbzwMJDmN7U7CcQPjPb6x7F7BYpC2GGULXL1awF13FmOKXU622jwICrCv_ug7MZLf8iz/exec';

    var isStandalone =
      window.navigator.standalone === true ||
      window.matchMedia('(display-mode: standalone)').matches;

    // Launched from the home screen icon: go straight to the app.
    if (isStandalone) {
      window.location.replace(APP_URL);
    }
  </script>

  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #12294d; color: #fff; text-align: center; padding: 24px; box-sizing: border-box;
    }
    img.logo { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 16px; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { opacity: 0.85; font-size: 0.95rem; line-height: 1.5; margin: 8px 0; }
    .btn {
      display: inline-block; margin-top: 18px; padding: 12px 24px; border-radius: 10px;
      background: #c99a3f; color: #12294d; font-weight: 600; text-decoration: none;
    }
    .steps { margin-top: 22px; font-size: 0.9rem; opacity: 0.9; }
  </style>
</head>
<body>
  <div>
    <img class="logo" src="icon-180.png" alt="Yaara">
    <h1>Yaara Consortium</h1>
    <a class="btn" id="openLink" href="#">Open app</a>
    <div class="steps">
      <p><strong>Install on your phone</strong></p>
      <p><strong>iPhone:</strong> open this page in Safari, tap Share, then "Add to Home Screen".</p>
      <p><strong>Android:</strong> tap the browser menu (⋮), then "Add to Home screen" or "Install app".</p>
    </div>
  </div>
  <script>
    document.getElementById('openLink').href = APP_URL;
  </script>
</body>
</html>
